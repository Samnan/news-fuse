name: Release

on:
  push:
    branches: [master]
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"

          if [[ -z "$last_tag" ]]; then
            version="1.0.0"
            echo "No previous tag, starting at $version"
          else
            # Files touched since the last release (equals the commit's files for a single-commit push)
            changed="$(git diff --name-only "$last_tag" HEAD | wc -l | tr -d ' ')"
            IFS=. read -r major minor patch <<< "${last_tag#v}"

            if (( changed > 50 )); then
              major=$((major + 1)); minor=0; patch=0
            elif (( changed > 10 )); then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi

            version="$major.$minor.$patch"
            echo "Last tag $last_tag, $changed files changed -> $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "${{ needs.version.outputs.version }}"

      - run: npm ci

      # Build only; the release is created in a separate job once at least one build succeeds
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ strategy.job-index }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

  release:
    needs: [version, build]
    # Run even if some matrix builds failed; the collect step skips the release when no bundles exist
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      - name: Collect build outputs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          mapfile -t files < <(find bundles -type f | sort)
          if (( ${#files[@]} == 0 )); then
            echo "No build outputs found, skipping release"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.collect.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: News_Fuse_v${{ needs.version.outputs.version }}
          body: Please note that MacOS builds are not notorized. It may or may not run on your system directly.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: bundles/**
